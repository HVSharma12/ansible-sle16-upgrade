---
# raw: no Python needed, whatever release the host runs
- name: Read the release the host runs
  ansible.builtin.raw: cat /etc/os-release; test ! -e /var/log/distro_migration.log || echo DMS_LOG=present
  register: __upgrade_before
  changed_when: false
  check_mode: false

- name: Upgrade a SLES 15 host
  when: __upgrade_before.stdout is search('^VERSION_ID="?15[.]', multiline=True)
  block:
    - name: Analyse the host
      ansible.builtin.include_role:
        name: hvsharma12.sle16_upgrade.analyse
      vars:
        analyse_report_dir: ""
        analyse_fail_on_blocker: false

    - name: Refuse a host that is not ready
      vars:
        __storage: "{{ analyse_report.facts.storage }}"
        __reasons: "{{ ([] if analyse_report.verdict == 'ready' else ['analyse says ' ~ analyse_report.verdict ~ ': '
          ~ analyse_report.findings | rejectattr('severity', 'eq', 'info') | map(attribute='id') | join(', ')
          ~ ' (fix these, the remediate role covers some, and run again)'])
          + ([] if 'DMS_LOG=present' not in __upgrade_before.stdout else ['an earlier migration failed and left
          /var/log/distro_migration.log: read it and fix the cause, then move the log aside to start again (mv
          /var/log/distro_migration.log /var/log/distro_migration.log.failed)'])
          + ([] if upgrade_accept_no_rollback | bool or (__storage.root_fstype == 'btrfs' and __storage.snapper_root)
          else ['no snapper snapshot can roll the upgrade back: back the host up, then set
          upgrade_accept_no_rollback: true']) }}"
      ansible.builtin.assert:
        that: __reasons | length == 0
        fail_msg: "Not upgrading: {{ __reasons | join('; ') }}"
        success_msg: "{{ analyse_report.source.version }} is ready for SLES {{ analyse_report.target.version }}"

    - name: Show what the upgrade does
      ansible.builtin.debug:
        msg: >-
          {{ 'Would install' if ansible_check_mode else 'Installing' }} suse-migration-sle16-activation and
          {{ 'reboot' if ansible_check_mode else 'rebooting' }} into the migration to
          {{ analyse_report.target.product }} {{ analyse_report.target.version }}
      changed_when: ansible_check_mode

    - name: Install the migration activation
      ansible.builtin.command: zypper --non-interactive install suse-migration-sle16-activation
      environment:
        LC_ALL: C
      register: __upgrade_install
      changed_when: "'Nothing to do' not in __upgrade_install.stdout"

    # the package's %pre records it; it is gone once the migration removes the package
    - name: Read the snapper snapshot taken before the migration
      ansible.builtin.command: cat /var/cache/suse_migration_snapper_btrfs_pre_snapshot_number
      register: __upgrade_snapshot
      changed_when: false
      failed_when: false

    - name: Reboot into the migration and wait for the host
      block:
        - name: Reboot into the migration
          ansible.builtin.reboot:
            msg: Rebooting into the SLES 16 migration
            # a new ssh connection for each boot check; the migration system refuses all but its own user
            connect_timeout: 30
            reboot_timeout: "{{ upgrade_reboot_timeout }}"
            test_command: "! grep -q migration_target= /proc/cmdline"
          timeout: "{{ upgrade_reboot_timeout | int + 600 }}"
          register: __upgrade_reboot
          when: not ansible_check_mode
          # the last boot check of a timed-out wait is refused by the migration system; rescue cannot catch that
          ignore_unreachable: true

        - name: Stop when the host cannot be reached
          ansible.builtin.fail:
            msg: "{{ __upgrade_reboot.msg | d('the host is unreachable') }}"
          when: __upgrade_reboot is unreachable
      rescue:
        - name: Stop when the host does not come back
          ansible.builtin.fail:
            msg: >-
              The host did not come back from the migration in time
              ({{ (ansible_failed_result.msg | d('')).split() | join(' ') }}).
              While it migrates only the user "migration" can log in: when the host answers ssh again, run the role
              again; it reports the result without starting anything.

- name: Read and report the result
  when: not (ansible_check_mode and __upgrade_before.stdout is search('^VERSION_ID="?15[.]', multiline=True))
  block:
    - name: Read the release, the boot state and the failed units
      ansible.builtin.raw: |
        cat /etc/os-release
        echo "STATE=$(systemctl is-system-running --wait)"
        systemctl --failed --no-legend --plain | sed 's/^/FAILED=/'
        test ! -e /var/log/distro_migration.log || echo DMS_LOG=present
        grep -i 'failed with' /var/log/distro_migration.log 2>/dev/null | tail -n 3 | sed 's/^/DMS=/'
      register: __upgrade_after
      changed_when: false
      check_mode: false
      timeout: 600

    - name: Stop unless the host runs the target
      vars:
        __lines: "{{ __upgrade_after.stdout_lines | map('trim') | list }}"
        __pretty: "{{ __lines | select('match', 'PRETTY_NAME=') | map('regex_replace', '^PRETTY_NAME=\"?([^\"]*)\"?$',
          '\\1') | first | d('no PRETTY_NAME in /etc/os-release') }}"
        __version: "{{ __lines | select('match', 'VERSION_ID=') | map('regex_replace', '^VERSION_ID=\"?([^\"]*)\"?$',
          '\\1') | first | d('') }}"
      ansible.builtin.assert:
        that: __version == __upgrade_target_version
        fail_msg: >-
          SLES {{ __upgrade_target_version }} not reached: the host runs {{ __pretty }}.
          {{ ('/var/log/distro_migration.log: ' ~ __lines | select('match', 'DMS=') | map('replace', 'DMS=', '')
          | join(' | ')) if 'DMS_LOG=present' in __lines else '' }}
        success_msg: The host runs {{ __pretty }}

    - name: Report the result
      vars:
        __lines: "{{ __upgrade_after.stdout_lines | map('trim') | list }}"
      ansible.builtin.set_fact:
        # python3.11 is gone on SLES 16
        ansible_python_interpreter: /usr/bin/python3
        upgrade_result:
          upgraded: "{{ __upgrade_reboot.rebooted | d(false) }}"
          version_id: "{{ __upgrade_target_version }}"
          system_state: "{{ __lines | select('match', 'STATE=') | map('replace', 'STATE=', '') | first | d('') }}"
          failed_units: "{{ __lines | select('match', 'FAILED=') | map('regex_replace', '^FAILED=(\\S+).*$', '\\1')
            | list }}"
          migration_log: "{{ '/var/log/distro_migration.log' if 'DMS_LOG=present' in __lines else none }}"
          rollback_snapshot: "{{ __upgrade_snapshot.stdout | d('', true) | trim or none }}"

    - name: Show the result
      ansible.builtin.debug:
        var: upgrade_result
