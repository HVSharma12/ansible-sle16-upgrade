---
# raw: no Python needed, whatever release the host runs
- name: Read the release the host runs
  ansible.builtin.raw: >-
    cat /etc/os-release; test ! -e /var/log/distro_migration.log || echo DMS_LOG=present;
    grep -q migration_target= /proc/cmdline && echo MIGRATING=yes || true
  register: __upgrade_before
  changed_when: false
  check_mode: false

- name: Stop unless the host runs SLES 15 or 16
  vars:
    __pretty: "{{ __upgrade_before.stdout_lines | select('match', 'PRETTY_NAME=') | first | d('no /etc/os-release') }}"
  ansible.builtin.assert:
    that:
      - "'MIGRATING=yes' not in __upgrade_before.stdout"
      - __upgrade_before.stdout is search('^VERSION_ID="?1[56][.]', multiline=True)
    fail_msg: "{{ 'The host runs the migration system: wait until it boots SLES again, then run the role again'
      if 'MIGRATING=yes' in __upgrade_before.stdout else 'Not a SLES 15 host: ' ~ __pretty }}"
    quiet: true

- name: Upgrade a SLES 15 host
  when: __upgrade_before.stdout is search('^VERSION_ID="?15[.]', multiline=True)
  block:
    # the gate accepts only a report collected after this
    - name: Note when the analysis starts
      ansible.builtin.set_fact:
        __upgrade_started: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"

    - name: Analyse the host
      ansible.builtin.include_role:
        name: hvsharma12.sle16_upgrade.analyse
      vars:
        analyse_fail_on_blocker: false
        analyse_run_dms_prechecks: true
        analyse_check_patches: true
        analyse_target_product: SLES
        analyse_target_version: "{{ __upgrade_target_version }}"

    - name: Refuse a host that is not ready
      vars:
        __src: "{{ analyse_report.source }}"
        __storage: "{{ analyse_report.facts.storage }}"
        __reasons: "{{ ([] if analyse_report.collected_at >= __upgrade_started
          else ['the analysis is not from this run'])
          + ([] if analyse_report.verdict == 'ready' else ['analyse says ' ~ analyse_report.verdict ~ ': '
          ~ analyse_report.findings | rejectattr('severity', 'eq', 'info') | map(attribute='id') | join(', ')
          ~ ' (fix these, the remediate role covers some, and run again)'])
          + ([] if [__src.product, __src.version, __src.arch, analyse_report.target.product,
          analyse_report.target.version] == ['SLES', '15.7', 'x86_64', 'SLES', __upgrade_target_version]
          else ['this role is tested on SLES 15 SP7 x86_64 to SLES 16.1 only'])
          + ([] if analyse_report.dms_prechecks.installed | bool else ['the DMS pre-checks did not run: install
          suse-migration-pre-checks (the remediate role does) and run again'])
          + ([] if analyse_report.facts.updates.needed_patches is not none else ['the pending patches are not known:
          analyse_check_patches is false or zypper list-patches failed'])
          + ([] if 'DMS_LOG=present' not in __upgrade_before.stdout else ['an earlier migration left
          /var/log/distro_migration.log: read it and fix the cause, then move the log aside to start again (mv
          /var/log/distro_migration.log /var/log/distro_migration.log.failed)'])
          + ([] if upgrade_accept_no_rollback | bool or (__storage.root_fstype == 'btrfs' and __storage.snapper_root)
          else ['no snapper snapshot can roll back a failed migration: back the host up, then set
          upgrade_accept_no_rollback: true']) }}"
      ansible.builtin.assert:
        that: __reasons | length == 0
        fail_msg: "Not upgrading: {{ __reasons | join('; ') }}"
        success_msg: "{{ __src.version }} is ready for SLES {{ analyse_report.target.version }}"
      register: __upgrade_gate

    - name: Install the migration and reboot into it
      # registered results, not the block's failure: errors ignored by the caller must not open the gate
      when:
        - __upgrade_gate is not skipped
        - __upgrade_gate is succeeded
      block:
        - name: Install the migration activation
          ansible.builtin.command: zypper --non-interactive install suse-migration-sle16-activation
          environment:
            LC_ALL: C
          register: __upgrade_install
          changed_when: "'Nothing to do' not in __upgrade_install.stdout"

        # skipped in check mode, from --check or the check_mode keyword
        - name: Show what check mode would do
          ansible.builtin.debug:
            msg: >-
              Would install suse-migration-sle16-activation and reboot into the migration to
              {{ analyse_report.target.product }} {{ analyse_report.target.version }}
          changed_when: true
          when: __upgrade_install is skipped

        # the package's %pre records it; it is gone once the migration removes the package
        - name: Read the snapper snapshot taken before the migration
          ansible.builtin.command: cat /var/cache/suse_migration_snapper_btrfs_pre_snapshot_number
          register: __upgrade_snapshot
          changed_when: false
          failed_when: false

        # runs before the stop, so errors ignored by the caller cannot leave the host armed
        - name: Remove the migration again when snapper took no snapshot
          ansible.builtin.command: zypper --non-interactive remove suse-migration-sle16-activation SLES16-Migration
          environment:
            LC_ALL: C
          register: __upgrade_disarm
          changed_when: true
          # 104: one of the two was not installed; zypper removes the other
          failed_when: __upgrade_disarm.rc not in [0, 104]
          when:
            - __upgrade_install is not skipped
            - __upgrade_install is succeeded
            - not upgrade_accept_no_rollback | bool
            - __upgrade_snapshot.stdout | d('') | trim | length == 0

        - name: Stop when snapper took no snapshot
          ansible.builtin.fail:
            msg: >-
              snapper took no snapshot before the migration, so a failed migration cannot be rolled back;
              {{ 'the migration packages were removed again' if __upgrade_disarm is succeeded else 'disarm the host
              with: zypper --non-interactive remove suse-migration-sle16-activation SLES16-Migration' }}
          register: __upgrade_no_snapshot
          when: __upgrade_disarm is not skipped

        - name: Reboot into the migration
          ansible.builtin.reboot:
            msg: Rebooting into the SLES 16 migration
            # a new ssh connection for each boot check; the migration system refuses root
            connect_timeout: 30
            reboot_timeout: "{{ upgrade_reboot_timeout }}"
            test_command: "! grep -q migration_target= /proc/cmdline"
          timeout: "{{ upgrade_reboot_timeout | int + 600 }}"
          register: __upgrade_reboot
          when:
            - __upgrade_install is not skipped
            - __upgrade_install is succeeded
            - __upgrade_no_snapshot is skipped
          # the last boot check of a timed-out wait is refused by the migration system; rescue cannot catch that
          ignore_unreachable: true

        - name: Stop when the host cannot be reached
          ansible.builtin.fail:
            msg: "{{ __upgrade_reboot.msg | d('the host is unreachable') }}"
          when: __upgrade_reboot is unreachable
      rescue:
        - name: Stop and say what state the host is in
          vars:
            __why: "{{ (ansible_failed_result.msg | d('')).split() | join(' ') }}"
          ansible.builtin.fail:
            msg: "{{ ('The host did not come back from the migration in time (' ~ __why ~ '). It may still be
              migrating, or it may not have come back. When root can log in again, run the role again; it
              reports the result without starting anything.')
              if (__upgrade_reboot | d({})).rebooted | d(false) or __upgrade_reboot | d({}) is unreachable
              else ('Not upgrading: ' ~ __why) if __upgrade_no_snapshot | d({}) is failed
              else ('The reboot into the migration did not start (' ~ __why ~ '). '
              ~ ('suse-migration-sle16-activation is installed, so' if __upgrade_install is defined
              and __upgrade_install is succeeded else 'If suse-migration-sle16-activation is installed,')
              ~ ' the host migrates at its next reboot, with no new analysis; disarm it with: zypper
              --non-interactive remove suse-migration-sle16-activation SLES16-Migration') }}"

- name: Read and report the result
  when: not (__upgrade_before.stdout is search('^VERSION_ID="?15[.]', multiline=True) and __upgrade_install is skipped)
  block:
    - name: Read the release, the boot state and the failed units
      ansible.builtin.raw: |
        cat /etc/os-release
        echo "STATE=$(systemctl is-system-running --wait)"
        systemctl --failed --no-legend --plain | sed 's/^/FAILED=/'
        test ! -e /var/log/distro_migration.log || echo DMS_LOG=present
        grep -i 'failed with' /var/log/distro_migration.log 2>/dev/null | tail -n 3 | sed 's/^/DMS=/'
        rpm -q --quiet suse-migration-sle16-activation && echo ARMED=yes || true
      register: __upgrade_after
      changed_when: false
      check_mode: false
      timeout: 600

    - name: Stop unless the host runs the target
      vars:
        __lines: "{{ __upgrade_after.stdout_lines | map('trim') | list }}"
        __pretty: "{{ __lines | select('match', 'PRETTY_NAME=') | map('regex_replace', '^PRETTY_NAME=\"?([^\"]*)\"?$',
          '\\1') | first | d('no PRETTY_NAME in /etc/os-release') }}"
        __dms: "{{ __lines | select('match', 'DMS=') | map('replace', 'DMS=', '') | list }}"
      ansible.builtin.assert:
        that:
          - __upgrade_version == __upgrade_target_version
          - __dms | length == 0
        # an armed host is named whatever stopped the role earlier, also when the caller ignored it
        fail_msg: >-
          {{ ('SLES ' ~ __upgrade_target_version ~ ' reached, but the migration log reports a failure.')
          if __upgrade_version == __upgrade_target_version else ('SLES ' ~ __upgrade_target_version
          ~ ' not reached: the host runs ' ~ __pretty ~ '.') }}
          {{ ('/var/log/distro_migration.log: ' ~ __dms | join(' | ')) if 'DMS_LOG=present' in __lines else '' }}
          {{ 'suse-migration-sle16-activation is installed, so the next reboot starts the migration; disarm it with:
          zypper --non-interactive remove suse-migration-sle16-activation SLES16-Migration'
          if 'ARMED=yes' in __lines else '' }}
        success_msg: The host runs {{ __pretty }}

    - name: Use the Python of SLES 16 for the rest of the run
      ansible.builtin.set_fact:
        # python3.11 is gone on SLES 16
        ansible_python_interpreter: /usr/bin/python3
      when: __upgrade_reboot.rebooted | d(false)

    - name: Report the result
      vars:
        __lines: "{{ __upgrade_after.stdout_lines | map('trim') | list }}"
        __state: "{{ __lines | select('match', 'STATE=') | map('replace', 'STATE=', '') | first | d('') }}"
        __failed: "{{ __lines | select('match', 'FAILED=') | map('regex_replace', '^FAILED=(\\S+).*$', '\\1') | list }}"
      # one expression: before ansible-core 2.19 a none templated into a mapping value becomes ""
      ansible.builtin.set_fact:
        upgrade_result: "{{ {'upgraded': __upgrade_reboot.rebooted | d(false), 'version_id': __upgrade_version,
          'system_state': __state, 'failed_units': __failed,
          'migration_log': '/var/log/distro_migration.log' if 'DMS_LOG=present' in __lines else none,
          'rollback_snapshot': __upgrade_snapshot.stdout | d('', true) | trim or none} }}"

    - name: Show the result
      ansible.builtin.debug:
        var: upgrade_result
