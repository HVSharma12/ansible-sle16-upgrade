---
- name: Refresh the repository metadata
  # the plan counts patches from this metadata; failed_when false: an unreachable third-party repository must not
  # stop its own remediation
  ansible.builtin.command: zypper --non-interactive refresh
  changed_when: false
  failed_when: false

- name: Analyse the host
  ansible.builtin.include_role:
    name: hvsharma12.sle16_upgrade.analyse
  vars:
    analyse_report_dir: ""
    analyse_fail_on_blocker: false

- name: Plan the changes
  ansible.builtin.set_fact:
    remediate_plan: "{{ analyse_report | hvsharma12.sle16_upgrade.sle16_upgrade_plan(remediate_opt_in,
      remediate_remove_packages) }}"

- name: Show the plan
  ansible.builtin.debug:
    var: remediate_plan
  # in check mode the plan is the dry run: changed when it would change something
  changed_when: ansible_check_mode and remediate_plan.changes | length > 0

# LC_ALL=C on every zypper task whose output is matched below
- name: Disable repositories
  ansible.builtin.command:
    argv: "{{ ['zypper', '--non-interactive', 'modifyrepo', '--disable', '--']
      + remediate_plan.changes.disable_repositories }}"
  environment:
    LC_ALL: C
  register: __remediate_repos
  changed_when: __remediate_repos.stdout is search('successfully disabled')
  when: remediate_plan.changes.disable_repositories is defined

- name: Install the DMS pre-checks
  ansible.builtin.command: zypper --non-interactive install --no-recommends suse-migration-pre-checks
  environment:
    LC_ALL: C
  register: __remediate_prechecks
  changed_when: "'Nothing to do' not in __remediate_prechecks.stdout"
  when: remediate_plan.changes.install_prechecks is defined

- name: Install patches until none are left
  # --with-interactive: without it the patches that need a reboot are skipped
  ansible.builtin.command: zypper --non-interactive patch --with-interactive
  environment:
    LC_ALL: C
  register: __remediate_patch
  changed_when: "'Nothing to do' not in __remediate_patch.stdout or __remediate_patch.attempts | d(1) > 1"
  failed_when: __remediate_patch.rc not in [0, 102, 103]
  until: __remediate_patch is skipped or 'Nothing to do' in __remediate_patch.stdout
  retries: 3
  delay: 1
  when: remediate_plan.changes.patch is defined

- name: Reboot when needed
  when: remediate_plan.changes.reboot is defined
  block:
    - name: Check whether a reboot is needed
      ansible.builtin.command: zypper needs-rebooting
      register: __remediate_needs_reboot
      changed_when: false
      failed_when: __remediate_needs_reboot.rc not in [0, 102]
      check_mode: false

    - name: Reboot
      ansible.builtin.reboot:
        # with connect_timeout set, each boot check starts a new ssh connection instead of one that died with the
        # reboot, which without keepalive waits forever
        connect_timeout: 30
      timeout: 900
      when: __remediate_needs_reboot.rc == 102

- name: Remove the old kernels
  when: remediate_plan.changes.purge_kernels is defined
  block:
    - name: Keep only the latest and the running kernel
      ansible.builtin.lineinfile:
        path: /etc/zypp/zypp.conf
        regexp: '^\s*multiversion\.kernels\s*='
        line: multiversion.kernels = latest,running
        backup: true

    - name: Purge the other kernels
      ansible.builtin.command: zypper --non-interactive purge-kernels
      environment:
        LC_ALL: C
      register: __remediate_purge
      changed_when: __remediate_purge.stdout is search('Removing')

- name: Remove the packages SLE 16 removes
  when: remediate_plan.changes.remove_packages is defined
  # --no-clean-deps, also over zypp.conf: python311 may be installed only for Salt, and Ansible needs it until the
  # upgrade
  environment:
    LC_ALL: C
  vars:
    __remediate_remove_argv: "{{ ['zypper', '--non-interactive', 'remove', '--no-clean-deps'] }}"
  block:
    - name: List every package the removal takes with it
      ansible.builtin.command:
        argv: "{{ __remediate_remove_argv + ['--dry-run', '--'] + remediate_plan.changes.remove_packages }}"
      changed_when: false
      failed_when: __remediate_remove_dry.rc not in [0, 104]
      check_mode: false
      register: __remediate_remove_dry

    - name: Stop unless the removal takes exactly the listed packages
      vars:
        __taken: "{{ (__remediate_remove_dry.stdout
          | regex_findall('packages? (?:is|are) going to be REMOVED:\\n((?:  .*\\n?)+)') | join(' ')).split() }}"
        __unlisted: "{{ __taken | difference(remediate_remove_packages) }}"
        __unseen: "{{ remediate_plan.changes.remove_packages | difference(__taken) }}"
      ansible.builtin.assert:
        that:
          - __unlisted | length == 0
          # a dry run output this does not parse stops the removal
          - __unseen | length == 0
        fail_msg: "{{ 'The removal also takes ' ~ __unlisted | join(', ') ~ ': list them in remediate_remove_packages
          to remove them too' if __unlisted else 'The dry run does not show ' ~ __unseen | join(', ') ~ ' as
          removed; nothing was removed' }}"
        success_msg: "The removal takes {{ __taken | join(', ') }}"

    - name: Remove the packages
      ansible.builtin.command:
        argv: "{{ __remediate_remove_argv + ['--'] + remediate_plan.changes.remove_packages }}"
      register: __remediate_remove
      changed_when: "'Nothing to do' not in __remediate_remove.stdout"
      failed_when: __remediate_remove.rc not in [0, 104]

- name: Set the migration target
  ansible.builtin.lineinfile:
    path: /etc/sle-migration-service.yml
    regexp: "^migration_product:"
    line: "migration_product: {{ remediate_plan.changes.migration_product }}"
    create: true
    mode: "0644"
  when: remediate_plan.changes.migration_product is defined

- name: Keep root SSH login after the upgrade
  ansible.builtin.copy:
    content: "PermitRootLogin yes\n"
    dest: "{{ remediate_plan.changes.ssh_root_login }}"
    mode: "0600"
  when: remediate_plan.changes.ssh_root_login is defined
