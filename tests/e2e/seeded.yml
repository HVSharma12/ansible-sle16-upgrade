---
# Seed one condition on a throwaway VM, analyse, assert the finding, undo the seed (not unregistered,
# separate_var or old_kernels). -e seed=<see tasks/seed.yml> -e expect_id=<finding id>
# -e expect_severity=<blocker|needs_action|info>
- name: Seed, analyse, assert
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Seed {{ seed }}
      ansible.builtin.include_tasks: tasks/seed.yml

    - name: Analyse and assert
      block:
        - name: Run the role
          ansible.builtin.include_role:
            name: hvsharma12.sle16_upgrade.analyse

        - name: Check the seeded finding
          vars:
            __found: "{{ analyse_report.findings | selectattr('id', 'eq', expect_id) | list }}"
          ansible.builtin.assert:
            that:
              - __found | length == 1
              - __found[0].severity == expect_severity
            fail_msg: "{{ expect_id }}: {{ __found }}"
      always:
        - name: Remove the third-party repository
          ansible.builtin.file:
            path: /etc/zypp/repos.d/e2e-third-party.repo
            state: absent
          when: seed == 'third_party_repo'

        - name: Remove the fill file
          ansible.builtin.file:
            path: /var/tmp/e2e-fill
            state: absent
          when: seed == 'low_space'

        - name: Remove the package
          ansible.builtin.command: zypper --non-interactive remove --clean-deps nscd
          when: seed == 'removed_package'
          changed_when: true
